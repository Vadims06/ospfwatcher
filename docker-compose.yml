services:
  ospf-logstash:
    build:
      context: logstash/
      args:
        LOGSTASH_OSS_VERSION: $LOGSTASH_OSS_VERSION
    container_name: ospf-logstash
    volumes:
      - type: bind
        source: ./logstash/config/logstash.yml
        target: /usr/share/logstash/config/logstash.yml
        read_only: true
      - type: bind
        source: ./logstash/pipeline
        target: /usr/share/logstash/pipeline
        read_only: true
      - type: bind
        source: ./watcher/logs
        # for containerlab integration
        # source: ./containerlab/ospf01/watcher/logs
        target: /home/watcher/watcher/logs
        read_only: true
    environment:
      ELASTIC_USER_LOGIN: $ELASTIC_USER_LOGIN
      ELASTIC_USER_PASS: $ELASTIC_USER_PASS
      ELASTIC_IP: $ELASTIC_IP
      ELASTIC_PORT: $ELASTIC_PORT
      ZABBIX_HOST: $ZABBIX_HOST
      DEBUG_BOOL: $DEBUG_BOOL
      EXPORT_TO_ELASTICSEARCH_BOOL: $EXPORT_TO_ELASTICSEARCH_BOOL
      EXPORT_TO_ZABBIX_BOOL: $EXPORT_TO_ZABBIX_BOOL
      EXPORT_TO_WEBHOOK_URL_BOOL: $EXPORT_TO_WEBHOOK_URL_BOOL
      WEBHOOK_URL: $WEBHOOK_URL
      EXPORT_TO_TOPOLOGRAPH_SOCKET: $EXPORT_TO_TOPOLOGRAPH_SOCKET
      TOPOLOGRAPH_HOST: $TOPOLOGRAPH_HOST
      TOPOLOGRAPH_PORT: $TOPOLOGRAPH_PORT
      TOPOLOGRAPH_WEB_API_USERNAME_EMAIL: ${TOPOLOGRAPH_WEB_API_USERNAME_EMAIL}
      TOPOLOGRAPH_WEB_API_PASSWORD: ${TOPOLOGRAPH_WEB_API_PASSWORD}
      EXPORT_TO_LOKI_BOOL: $EXPORT_TO_LOKI_BOOL
      LOKI_URL: $LOKI_URL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    depends_on:
     - ospf-logstash-index-creator
    networks:
      - topolograph_backend
  
  ospf-logstash-index-creator:
    image: ${REGISTRY_PREFIX:-}vadims06/ospf-watcher:${WATCHER_VERSION}
    container_name: ospf-logstash-index-creator
    volumes:
      - type: bind
        source: ./logstash/index_template/create.py
        target: /home/watcher/watcher/create.py
        read_only: true
    environment:
      ELASTIC_USER_LOGIN: $ELASTIC_USER_LOGIN
      ELASTIC_USER_PASS: $ELASTIC_USER_PASS
      ELASTIC_IP: $ELASTIC_IP
      ELASTIC_PORT: $ELASTIC_PORT
    entrypoint: ["python", "create.py"]
    networks:
      - topolograph_backend

  fluent-bit:
    image: ${REGISTRY_PREFIX:-}fluent/fluent-bit:3.2
    container_name: ospf-fluent-bit
    # onboarding.yaml when installed from Topolograph's Watchers page
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/${FLUENT_BIT_CONFIG:-fluent-bit.yaml}"]
    restart: unless-stopped
    profiles:
      - fluent-bit
    volumes:
      - type: bind
        source: ./fluentbit
        target: /fluent-bit/etc
        read_only: true
      - type: bind
        source: ./watcher/logs
        target: /home/watcher/watcher/logs
        read_only: true
    environment:
      TOPOLOGRAPH_HOST: ${TOPOLOGRAPH_HOST:-localhost}
      TOPOLOGRAPH_PORT: ${TOPOLOGRAPH_PORT:-8080}
      TOPOLOGRAPH_WEB_API_USERNAME_EMAIL: ${TOPOLOGRAPH_WEB_API_USERNAME_EMAIL}
      TOPOLOGRAPH_WEB_API_PASSWORD: ${TOPOLOGRAPH_WEB_API_PASSWORD}
      WEBHOOK_HOST: ${WEBHOOK_HOST:-localhost}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-9090}
      WEBHOOK_URI: ${WEBHOOK_URI:-/}
      WEBHOOK_TLS_ON: ${WEBHOOK_TLS_ON:-off}

networks:
  topolograph_backend:
    external: true
    name: topolograph_backend
