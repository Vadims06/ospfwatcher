arrives</text><text x='40' y='352' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' text-anchor='start' fill='#263238'>What may leave gre1</text><text x='56' y='378' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='start' fill='#2e7d32'>✓  Hello, Database Description, LS Request, LS Ack</text><text x='56' y='398' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='start' fill='#2e7d32'>✓  LS Update whose every LSA is the watcher's own Router LSA: no V/E/B flags, at most one point-to-point link, stub links only for the tunnel network</text><text x='56' y='424' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='start' fill='#c62828'>✗  Any other LS Update: other LSA types, other routers' LSAs, transit or virtual links, foreign stubs</text><text x='56' y='444' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='start' fill='#c62828'>✗  Anything that cannot be parsed: truncated or fragmented packets</text></svg>
