nt-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>Watcher</text><text x='125.0' y='255.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>logs OSPF changes</text><rect x='250' y='106' width='90' height='44' rx='6' fill='#f4f6f8' stroke='#263238' stroke-width='1.5' /><text x='295.0' y='133.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#263238'>gre1</text><rect x='250' y='180' width='190' height='50' rx='6' fill='#fff3e0' stroke='#ef6c00' stroke-width='1.5' /><text x='345.0' y='202.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#263238'>tc-BPF filter</text><text x='345.0' y='218.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>egress of gre1</text><rect x='360' y='262' width='70' height='30' rx='6' fill='#f4f6f8' stroke='#263238' stroke-width='1.5' /><text x='395.0' y='282.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>veth1</text><rect x='490' y='262' width='80' height='30' rx='6' fill='#f4f6f8' stroke='#263238' stroke-width='1.5' /><text x='530.0' y='282.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>vhost</text><rect x='590' y='262' width='60' height='30' rx='6' fill='#f4f6f8' stroke='#263238' stroke-width='1.5' /><text x='620.0' y='282.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='middle' fill='#263238'>eth0</text><rect x='730' y='230' width='200' height='70' rx='6' fill='#f4f6f8' stroke='#263238' stroke-width='1.5' /><text x='830.0' y='262.0' font-family='Segoe UI, Helvetica, Arial, 